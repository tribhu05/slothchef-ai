services:
  - type: web
    name: slothchef-ai
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: GEMMA_MODEL
        value: gemma2:2b
      - key: OLLAMA_BASE_URL
        value: http://localhost:11434
